version: '3'
services:
  ganache:
    image: trufflesuite/ganache-cli
    command: '--hostname=0.0.0.0 --mnemonic "candy maple cake sugar pudding cream honey rich smooth crumble sweet treat" --db "./"'


  truffle:
    build: blockchain
    command:  sh -c './start-ganache.sh'
    ports:
      - "8000:8000"
    links:
     - ganache

  web-api:
    build: web-api
    ports:
     - "3000:3000"
    command: sh -c './wait-for-ganache.sh'
    depends_on:
     - truffle
